services:
  - type: web
    name: ledger-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALPACA_ENV
        value: paper
      - key: ALPACA_FEED
        value: iex
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: API_TOKEN
        sync: false
      - key: QUIVER_API_TOKEN
        sync: false
      - key: MASSIVE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
