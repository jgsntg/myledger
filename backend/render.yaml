services:
  - type: web
    name: ledger-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /docs
    disk:
      name: ledger-db
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: /data/ledger.db
      - key: ALPACA_ENV
        value: paper
      - key: ALPACA_FEED
        value: iex
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: API_TOKEN
        sync: false
      - key: QUIVER_API_TOKEN
        sync: false
      - key: MASSIVE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
